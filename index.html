<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#30483A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GraceGuide">
    <meta name="description" content="Read Scripture, chat with the Shepherd AI, journal, and grow in community — all in one place.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="img/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="img/icons/icon-512.png">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <title>GRACEGUIDE — AI Christian Companion </title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/features.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- App Shell -->
    <div id="app" class="app-shell">
        <!-- Splash Screen -->
        <div id="splash-screen" class="splash-screen">
            <div class="splash-logo">
                <div class="splash-icon">
                    <img src="img/logo.png" alt="GraceGuide" onerror="this.onerror=null; this.style.display='none'; this.parentElement.classList.add('splash-icon-fallback');">
                </div>
                <h1 class="splash-title">GRACE<span class="brand-guide">GUIDE</span></h1>
                <p class="splash-subtitle">Your AI Christian Companion</p>
            </div>
            <div class="splash-loader">
                <div class="loader-bar"></div>
            </div>
        </div>

        <!-- Main Content -->
        <div id="main-content" class="main-content hidden">
            <!-- Top Bar -->
            <header id="top-bar" class="top-bar">
                <div class="top-bar-left">
                    <button id="menu-btn" class="icon-btn" aria-label="Menu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="top-bar-title" id="top-bar-title">Grace<span class="brand-guide">Guide</span></span>
                </div>
                <div class="top-bar-right">
                    <button id="space-add-btn" class="icon-btn hidden" aria-label="New Space post">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button id="back-btn" class="icon-btn hidden" aria-label="Back">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <button id="notif-btn" class="icon-btn" aria-label="Notifications">
                        <i class="fas fa-bell"></i>
                        <span id="notif-badge" class="badge hidden">0</span>
                    </button>
                    <button id="profile-nav-btn" class="icon-btn profile-nav-btn" aria-label="Profile">
                        <div id="profile-nav-avatar" class="profile-nav-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                    </button>
                </div>
            </header>

            <!-- Side Drawer -->
            <div id="drawer-overlay" class="drawer-overlay hidden"></div>
            <aside id="side-drawer" class="side-drawer">
                <div class="drawer-header">
                    <div class="drawer-logo">
                        <img src="img/logo.png" alt="GraceGuide" onerror="this.style.display='none';">
                        <span>Grace<span class="brand-guide">Guide</span></span>
                    </div>
                    <button id="drawer-close" class="icon-btn"><i class="fas fa-times"></i></button>
                </div>
                <nav class="drawer-nav">
                    <a href="#/home" class="drawer-link" data-route="home"><i class="fas fa-home"></i> Home</a>
                    <a href="#/bible" class="drawer-link" data-route="bible"><i class="fas fa-book-bible"></i> Bible</a>
                    <a href="#/ask" class="drawer-link active" data-route="ask"><i class="fas fa-dove"></i> Shepherd</a>
                    <a href="#/space" class="drawer-link" data-route="space"><i class="fas fa-compass"></i> Space</a>
                    <a href="#/community" class="drawer-link" data-route="community"><i class="fas fa-users"></i> Forum <span id="drawer-badge-community" class="drawer-badge-dot hidden"></span></a>
                    <a href="#/planner" class="drawer-link" data-route="planner"><i class="fas fa-calendar-check"></i> Study Planner</a>
                    <a href="#/messages" class="drawer-link" data-route="messages"><i class="fas fa-comment-dots"></i> Chats <span id="drawer-badge-messages" class="drawer-badge-dot hidden"></span></a>
                    <a href="#/profile" class="drawer-link" data-route="profile"><i class="fas fa-user"></i> My Profile</a>
                    <a href="#/talk-to-someone" class="drawer-link drawer-link-support" data-route="talk-to-someone"><i class="fas fa-hand-holding-heart"></i> Talk to Someone</a>
                    <a href="#/settings" class="drawer-link" data-route="settings"><i class="fas fa-cog"></i> Settings</a>
                    <a href="admin.html" id="drawer-link-admin" class="drawer-link hidden" target="_blank" rel="noopener"><i class="fas fa-user-shield"></i> Admin Dashboard</a>
                </nav>
                <div class="drawer-footer">
                    <button id="drawer-install-btn" class="btn btn-primary btn-sm btn-block hidden" style="margin-bottom: 8px;">
                        <i class="fas fa-download"></i> Install App
                    </button>
                    <button id="drawer-logout" class="btn btn-outline btn-sm hidden"><i class="fas fa-right-to-bracket"></i> Sign In</button>
                </div>
            </aside>

            <!-- Page Container -->
            <main id="page-container" class="page-container">
                <!-- Dynamic views rendered here -->
            </main>

            <!-- Bottom Navigation -->
            <nav id="bottom-nav" class="bottom-nav bottom-nav-3">
                <a href="#/home" class="nav-item" data-route="home">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
                <a href="#/ask" class="nav-item nav-center" data-route="ask">
                    <div class="nav-center-circle">
                        <i class="fas fa-dove"></i>
                    </div>
                    <span>Shepherd</span>
                </a>
                <a href="#/space" class="nav-item" data-route="space">
                    <i class="fas fa-compass"></i>
                    <span>Space</span>
                </a>
            </nav>

            <!-- Toast Container -->
            <div id="toast-container" class="toast-container"></div>

            <!-- Modal Container -->
            <div id="modal-container" class="modal-container hidden"></div>

            <!-- Bottom Sheet Container -->
            <div id="sheet-container" class="sheet-container hidden"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

    <!-- Main Application Script -->
    <script src="js/config.js"></script>
    <script src="js/core.js"></script>
    <script src="js/features.js"></script>
    <script src="js/community.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
